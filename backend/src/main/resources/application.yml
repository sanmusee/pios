spring:
  application:
    name: pios-backend

  datasource:
    url: jdbc:mysql://localhost:3306/pios?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.pios.entity

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.pios: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:your-secret-key-here-change-in-production}
  expiration: 86400000

pios:
  data-collection:
    enabled: true
    cron: "0 0 6 * * ?"
  report:
    generation-time: "07:00"
  llm:
    kimi:
      api-key: ${KIMI_API_KEY:}
      model: kimi-k2.5
