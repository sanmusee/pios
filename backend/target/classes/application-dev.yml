spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:sqlite:${user.home}/.pios/pios_dev.db
    driver-class-name: org.sqlite.JDBC
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    com.pios: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
